<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>tela board</title>
  <style>
    body { font: 16px system-ui; margin: 2rem; }
    .task { display: flex; gap: .5rem; margin: .25rem 0; }
    .task.done .title { text-decoration: line-through; opacity: .6; }
    .done { color: green; }
  </style>
</head>
<body>
  <div id="app">
    <h1>Tasks: <span data-tela-text="count"></span></h1>
    <button data-tela-on-click="add">Add task</button>
    <p data-tela-if="empty">No tasks yet.</p>
    <ul id="tasks">
      <template data-tela-each="tasks">
        <li class="task">
          <button data-toggle data-tela-on-click="toggle">done</button>
          <span class="title" data-field="title"></span>
        </li>
      </template>
    </ul>
  </div>
  <script src="board.js"></script>
</body>
</html>
